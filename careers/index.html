<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>바로담 인재영입 - 바로담 채용 사이트</title>
<meta name="description" content="필요한 모든 것을 바로 담는 커머스, 바로담과 함께할 동료를 찾습니다.">
<meta property="og:title" content="바로담 Careers">
<meta property="og:image" content="https://barodam.kro.kr/careers/img/hero.jpg">
<meta name="theme-color" content="#E8461E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23E8461E'/%3E%3Ctext x='32' y='45' font-size='36' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='900'%3E%EB%8B%B4%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@400;500;600;700;800;900&display=swap">
<style>
:root{--ink:#111318;--muted:#5d6370;--line:#e4e6eb;--sunk:#f4f5f7;--bg:#fff;--accent:#E8461E;--accent2:#1E3A8A;--ok:#0B8457;--disp:"Black Han Sans","Gothic A1",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#eceef2;--muted:#a2a8b4;--line:#2b3039;--sunk:#1b1e24;--bg:#121418}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:clip}
a{color:inherit}button,input,select,textarea{font:inherit;color:inherit}
.w{max-width:1180px;margin:0 auto;padding:0 20px}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* header */
.hd{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px)}
.hd .w{display:flex;align-items:center;height:72px;gap:20px}
.lg{display:flex;align-items:baseline;gap:6px;text-decoration:none;font-size:22px}
.lg .b{font-family:var(--disp);font-size:26px;letter-spacing:-.5px}.lg .b em{color:var(--accent);font-style:normal}
.lg .c{font-weight:500;letter-spacing:-.2px}
.nav{margin-left:auto;display:flex;gap:42px}
.nav a{text-decoration:none;font-weight:700;font-size:15px}
.nav a[aria-current="page"]{color:var(--accent)}
.mnav{display:none;margin-left:auto;border:0;background:none;font-size:24px;padding:6px}
/* common */
.h1{font-family:var(--disp);font-weight:400;font-size:clamp(38px,6.4vw,78px);line-height:1.18;letter-spacing:-1px;margin:72px 0 30px}
.lead{color:var(--muted);font-size:17px;line-height:1.85;margin:0}
.ph{border-radius:22px;overflow:hidden;margin-top:56px;background:var(--sunk)}
.ph img{width:100%;height:clamp(240px,42vw,520px);object-fit:cover;display:block}
.sec{padding:110px 0 0}
.h2{font-family:var(--disp);font-weight:400;font-size:clamp(28px,4vw,46px);line-height:1.3;margin:0 0 18px;letter-spacing:-.5px}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;background:var(--ink);color:var(--bg);border-radius:999px;padding:14px 28px;font-weight:800;text-decoration:none;cursor:pointer;font-size:15px}
.btn.acc{background:var(--accent);color:#fff}.btn.ghost{background:none;color:var(--ink);border:1.5px solid var(--line)}
.center{text-align:center}
/* job marquee */
.mq{overflow:hidden;margin-top:44px;mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.mq .tr{display:flex;gap:18px;width:max-content;animation:mq 46s linear infinite}
.mq:hover .tr{animation-play-state:paused}
@keyframes mq{to{transform:translateX(-50%)}}
.jc{text-align:left;width:330px;flex:none;border:1px solid var(--line);border-radius:18px;padding:24px;text-decoration:none;display:flex;flex-direction:column;gap:10px;min-height:176px;background:var(--bg);transition:border-color .2s,transform .2s}
.jc:hover{border-color:var(--accent);transform:translateY(-3px)}
.jc .t{color:var(--muted);font-size:13px}.jc b{font-size:19px;line-height:1.4}.jc .d{margin-top:auto;font-weight:800;color:var(--accent)}
.dd.ok{color:var(--ok)}
/* stories */
.stg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px 22px;margin-top:44px}
.st{text-decoration:none;display:grid;gap:12px}
.st .im{border-radius:16px;overflow:hidden;aspect-ratio:16/10;background:var(--sunk)}
.st img{width:100%;height:100%;object-fit:cover;transition:transform .35s}
.st:hover img{transform:scale(1.04)}
.st b{font-size:18px;line-height:1.45}.st span{color:var(--muted);font-size:14px}
.st .tag{display:inline-block;font-size:12px;font-weight:800;color:var(--accent);margin-bottom:-4px}
/* pillars */
.pil{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin-top:44px}
.pil div{background:var(--sunk);border-radius:20px;padding:30px 26px;display:flex;flex-direction:column;gap:12px;min-height:290px}
.pil i{font-style:normal;width:52px;height:52px;border-radius:14px;background:var(--bg);display:grid;place-items:center}
.pil i svg{width:28px;height:28px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pil h3{margin:6px 0 0;font-size:21px}.pil p{margin:0;color:var(--muted);font-size:14.5px}
.pil small{margin-top:auto;font-weight:800;font-size:13px}
/* more */
.more{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:36px}
.more a{border:1px solid var(--line);border-radius:18px;padding:28px;text-decoration:none;display:flex;flex-direction:column;gap:8px;min-height:170px}
.more a:hover{border-color:var(--ink)}
.more b{font-size:20px}.more span{color:var(--muted);font-size:14px}.more em{margin-top:auto;font-style:normal;font-weight:800}
/* footer */
.ft{margin-top:130px;border-top:1px solid var(--line)}
.ft .w{display:flex;align-items:center;gap:20px;padding-top:28px;padding-bottom:40px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.ft a{text-decoration:none;color:var(--muted)}.ft a b{color:var(--ink)}
.ft .fam{margin-left:auto;border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:var(--bg)}
/* jobs list */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:60px 0 24px}
.chips button{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 18px;font-weight:700;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.jl{border-top:1px solid var(--line)}
.jr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:28px 4px;border-bottom:1px solid var(--line);text-decoration:none}
.jr:hover b{color:var(--accent)}
.jr b{font-size:21px;display:block;margin-bottom:6px;transition:color .15s}
.jr .meta{color:var(--muted);font-size:13.5px}
.jr .meta span+span::before{content:"";display:inline-block;width:1px;height:10px;background:var(--line);margin:0 10px}
.jr .dd{font-weight:900;font-size:20px;color:var(--accent);white-space:nowrap}
.srch{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.srch input{border:1.5px solid var(--line);border-radius:999px;padding:10px 18px;min-width:240px;background:var(--bg)}
.cnt{color:var(--muted);font-size:14px;margin:0 0 10px}
/* job detail */
.jhero img{height:clamp(200px,32vw,380px)}
.jbar{position:sticky;top:72px;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.jbar .w{display:flex;align-items:center;gap:12px;height:76px}
.jbar h1{font-size:20px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jbar .share{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--ok);background:var(--bg);display:grid;place-items:center;cursor:pointer}
.jbar .share svg{width:20px;height:20px;stroke:var(--ok);fill:none;stroke-width:2}
.jbody{max-width:860px;margin:0 auto;padding:40px 20px 0}
.jtags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:26px}
.jtags span{background:var(--sunk);border-radius:6px;padding:4px 10px;font-size:13px;font-weight:700}
.cobox{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:16px;margin-bottom:34px}
.cobox div{padding:26px;text-align:center;font-size:13.5px;color:var(--muted)}
.cobox div+div{border-left:1px solid var(--line)}
.cobox b{display:block;font-family:var(--disp);font-weight:400;font-size:30px;color:var(--ink);margin-bottom:6px}.cobox b em{color:var(--accent);font-style:normal}
.jbody h2{font-size:19px;margin:38px 0 12px;padding-left:12px;border-left:4px solid var(--ink);line-height:1.2}
.jbody h4{margin:18px 0 6px;font-size:15.5px}
.jbody ul{margin:0;padding-left:20px}.jbody li{margin:4px 0}
.jbody p{margin:6px 0}
.proc{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.proc span{background:var(--sunk);border-radius:10px;padding:10px 16px;font-weight:700;font-size:14px}
.proc i{font-style:normal;align-self:center;color:var(--muted)}
.applyend{margin:50px 0 0;padding:34px;border-radius:20px;background:var(--sunk);display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
/* apply form */
.af{max-width:720px;margin:0 auto;padding:30px 20px 0}
.back{border:0;background:none;color:var(--muted);cursor:pointer;padding:0;font-size:14px}
.af h1{font-size:30px;margin:14px 0 4px}.af .pos{color:var(--muted);margin:0 0 28px}
.fg{margin-top:26px}
.fg>label,.fg>.lb{display:block;font-weight:800;margin-bottom:6px}
.fg .req::after{content:" *";color:var(--accent)}
.fg .ds{color:var(--muted);font-size:13.5px;margin:-2px 0 8px}
.in{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;background:var(--bg);outline:none}
.in:focus{border-color:var(--ink)}
textarea.in{min-height:180px;resize:vertical}
.file{display:flex;align-items:center;gap:10px;border:1.5px dashed var(--line);border-radius:12px;padding:16px;cursor:pointer}
.file:hover{border-color:var(--ink)}
.file input{position:absolute;opacity:0;width:1px;height:1px}
.file .nm{color:var(--muted);font-size:14px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .nm.on{color:var(--ink);font-weight:700}
.file .x{border:0;background:none;color:var(--muted);cursor:pointer}
.tpl{display:inline-block;margin-top:8px;font-size:13px}
.radio{display:flex;gap:18px}.radio label{display:flex;gap:6px;align-items:center;font-weight:500;cursor:pointer}
.agr{border:1px solid var(--line);border-radius:14px;margin-top:26px;overflow:hidden}
.agr details{border-top:1px solid var(--line)}.agr details:first-child{border-top:0}
.agr summary{display:flex;align-items:center;gap:10px;padding:16px;cursor:pointer;list-style:none;font-weight:700}
.agr summary input{width:18px;height:18px;accent-color:var(--accent)}
.agr summary .k{font-size:12px;font-weight:800;color:var(--muted);margin-left:auto}.agr summary .k.r{color:var(--accent)}
.agr .tx{padding:0 16px 16px 44px;color:var(--muted);font-size:13px;white-space:pre-line}
.err{color:var(--accent);font-weight:700;font-size:14px;margin-top:14px}
.fbtns{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:28px}
.fbtns .btn{justify-content:center}
.cntr{text-align:right;color:var(--muted);font-size:12.5px}
/* done / status */
.done{max-width:620px;margin:80px auto 0;padding:0 20px;text-align:center}
.ok{width:76px;height:76px;border-radius:50%;background:var(--ok);color:#fff;font-size:38px;display:grid;place-items:center;margin:0 auto 18px}
.card{border:1px solid var(--line);border-radius:18px;padding:24px;text-align:left;margin-top:22px}
.kv{display:grid;grid-template-columns:120px 1fr;gap:8px 14px;font-size:14.5px}.kv dt{color:var(--muted)}.kv dd{margin:0}
.steps{display:grid;grid-template-columns:repeat(4,1fr);margin:16px 0 4px}
.steps div{text-align:center;font-size:13px;color:var(--muted);position:relative;padding-top:28px}
.steps div::before{content:"";position:absolute;top:6px;left:50%;transform:translateX(-50%);width:16px;height:16px;border-radius:50%;background:var(--line);z-index:1}
.steps div::after{content:"";position:absolute;top:13px;left:-50%;width:100%;height:2px;background:var(--line)}
.steps div:first-child::after{display:none}
.steps div.on{color:var(--ink);font-weight:800}.steps div.on::before,.steps div.on::after{background:var(--accent)}
/* culture */
.chero{position:relative;color:#fff;min-height:620px;display:flex;align-items:center;margin-top:-72px;padding-top:72px}
.chero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.chero::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.72),rgba(0,0,0,.25));z-index:-1}
.chero .w{width:100%}
.chero .h1{margin:0 0 20px}.chero p{font-size:17px;opacity:.9;margin:0}
body.dark-hd .hd{background:transparent;backdrop-filter:none;color:#fff}
body.dark-hd .hd.scrolled{background:color-mix(in srgb,var(--bg) 92%,transparent);color:var(--ink);backdrop-filter:blur(8px)}
.qmq{overflow:hidden;margin-top:-90px;position:relative;z-index:2}
.qmq .tr{display:flex;gap:18px;width:max-content;animation:mq 60s linear infinite}
.qmq:hover .tr{animation-play-state:paused}
.qc{width:320px;flex:none;background:var(--bg);border-radius:18px;padding:26px;box-shadow:0 10px 30px rgba(0,0,0,.12);font-size:14.5px;display:flex;flex-direction:column;gap:14px;min-height:230px}
.qc p{margin:0;color:var(--muted);line-height:1.75}.qc b{margin-top:auto}.qc small{color:var(--muted);display:block;font-weight:500}
.mv{display:grid;grid-template-columns:200px minmax(0,1fr);gap:30px;padding:70px 0;border-bottom:1px solid var(--line)}
.mv .lb{font-weight:900;color:var(--accent);font-size:18px}
.mv h3{font-family:var(--disp);font-weight:400;font-size:clamp(26px,3.6vw,40px);line-height:1.35;margin:0 0 16px}
.mv p{color:var(--muted);margin:0 0 6px}
.wow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:40px}
.wow div{border:1px solid var(--line);border-radius:18px;padding:26px;min-height:200px;display:flex;flex-direction:column;gap:10px}
.wow .n{font-weight:900;color:var(--accent)}.wow b{font-size:18px;line-height:1.45}.wow span{margin-top:auto;color:var(--muted);font-size:13px;font-weight:700;letter-spacing:.02em}
.deck{margin-top:60px;border-radius:22px;background:var(--ink);color:var(--bg);padding:40px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.deck h3{margin:0 0 6px;font-size:24px}.deck p{margin:0;opacity:.75}
.deck .btn{background:var(--accent);color:#fff}
/* modal */
.mdl{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;display:grid;place-items:center;padding:20px}
.mbox{background:var(--bg);border-radius:20px;width:100%;max-width:760px;padding:28px;position:relative}
.mbox .cl{position:absolute;right:14px;top:14px;border:0;background:var(--sunk);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:18px}
.slide{min-height:330px;border-radius:16px;padding:40px;display:flex;flex-direction:column;justify-content:center;gap:14px;color:#fff}
.slide h4{font-family:var(--disp);font-weight:400;font-size:clamp(26px,4vw,40px);margin:0;line-height:1.3}.slide p{margin:0;opacity:.9;font-size:16px}
.slide small{opacity:.7;font-weight:800;letter-spacing:.08em}
.snav{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.snav button{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 18px;cursor:pointer;font-weight:700}
.dots{display:flex;gap:6px}.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--accent);width:22px;border-radius:4px}
/* faq */
.fq{border-top:1px solid var(--line);margin-top:60px}
.fq details{border-bottom:1px solid var(--line)}
.fq summary{list-style:none;cursor:pointer;padding:26px 4px;display:flex;gap:14px;font-size:18px;font-weight:800;align-items:flex-start}
.fq summary::before{content:"Q.";color:var(--accent);font-weight:900}
.fq summary::after{content:"+";margin-left:auto;font-weight:400;font-size:24px;line-height:1;color:var(--muted)}
.fq details[open] summary::after{content:"−"}
.fq .a{padding:0 4px 26px 40px;color:var(--muted);line-height:1.85;white-space:pre-line}
.ask{margin-top:50px;background:var(--sunk);border-radius:20px;padding:32px;display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap}
/* story */
.art{max-width:780px;margin:0 auto;padding:40px 20px 0}
.art .tag{color:var(--accent);font-weight:800}
.art h1{font-size:clamp(26px,4vw,40px);line-height:1.35;margin:10px 0 10px}
.art .by{color:var(--muted);margin-bottom:26px}
.art img{width:100%;border-radius:18px;display:block;margin:10px 0 26px}
.art h3{font-size:19px;margin:34px 0 8px}
.art p{line-height:1.95;margin:0 0 14px}
.art blockquote{margin:26px 0;padding:20px 24px;border-left:4px solid var(--accent);background:var(--sunk);border-radius:0 14px 14px 0;font-size:17px;font-weight:700}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:700;z-index:70}
@media (max-width:900px){.stg,.more{grid-template-columns:1fr 1fr}.pil,.wow{grid-template-columns:1fr 1fr}.nav{gap:22px}}
@media (max-width:700px){.nav{display:none;position:absolute;top:72px;left:0;right:0;background:var(--bg);flex-direction:column;gap:0;border-bottom:1px solid var(--line)}.nav.open{display:flex}.nav a{padding:16px 20px;border-top:1px solid var(--line)}.mnav{display:block}
 .stg,.more,.pil,.wow{grid-template-columns:1fr}.mv{grid-template-columns:1fr;gap:8px;padding:44px 0}.jc{width:270px}.qc{width:270px}.cobox{grid-template-columns:1fr}.cobox div+div{border-left:0;border-top:1px solid var(--line)}.jbar .btn{padding:12px 18px}.kv{grid-template-columns:90px 1fr}.steps div{font-size:11.5px}.chero{min-height:520px}.sec{padding-top:80px}.h1{margin-top:44px}}
@media (prefers-reduced-motion:reduce){.mq .tr,.qmq .tr{animation:none}html{scroll-behavior:auto}}
</style>
</head>
<body>
<header class="hd" id="hd"><div class="w">
  <a class="lg" href="#/"><span class="b">바로<em>담</em></span><span class="c">Careers</span></a>
  <button class="mnav" id="mnav" aria-label="메뉴 열기" aria-expanded="false">☰</button>
  <nav class="nav" id="nav"><a href="/#/info/about" target="_blank" rel="noopener">회사소개</a><a href="#/culture" data-n="culture">바로담 DNA</a><a href="#/jobs" data-n="jobs">채용공고</a><a href="#/faq" data-n="faq">자주 묻는 질문</a></nav>
</div></header>
<main id="app"></main>
<footer class="ft"><div class="w">
  <span>ⓒ BARODAM Corp. All rights reserved.</span><a href="#/privacy"><b>채용 개인정보 처리방침</b></a><a href="/#/info/privacy" target="_blank" rel="noopener">바로담 개인정보 처리방침</a><a href="#/status">지원 현황 조회</a>
  <select class="fam" id="fam" aria-label="패밀리 사이트"><option value="">Family site</option><option value="/">바로담 쇼핑</option><option value="/help/">바로담 고객센터</option><option value="/#/info/about">바로담 회사소개</option></select>
</div></footer>
<div id="mdl"></div>
<script>
(function(){

   <div class="mv"><div class="lb">Vision</div><div><h3>필요한 모든 것이<br>하루 안에 닿는 플랫폼</h3><p>바로담의 거래에는 한계가 없습니다.</p><p>시간과 공간, 온라인과 오프라인을 넘나들며 지금까지 없던 쇼핑 경험을 만들어 갑니다.</p><p>필요한 것을, 바로 담다. 그 기준을 바로담이 새로 씁니다.</p></div></div>
   <section class="sec"><span style="color:var(--accent);font-weight:900">Way of Working</span><h2 class="h2" style="margin-top:8px">일하는 방식을 소개합니다</h2>
    <div class="wow">${WAYS.map((w,i)=>`<div><span class="n num">0${i+1}</span><b>${esc(w[0])}</b><span>${w[1]}</span></div>`).join('')}</div>
    <div class="deck"><div><h3>바로담 Culture Deck을 소개합니다</h3><p>미션, 비전, 일하는 방식 등 바로담의 문화를 담았습니다.</p></div><button class="btn" id="dk">Culture Deck 1.0 보기 →</button></div></section>
   ${joinSec()}</div>`;
  $('#dk').onclick=()=>{let i=0;const draw=()=>{const d=DECK[i];modal(`<div class="slide" style="background:${d[0]}"><small>${d[1]}</small><h4>${d[2]}</h4><p>${d[3]}</p></div><div class="snav"><button id="sp" ${i?'':'disabled'}>‹ 이전</button><div class="dots">${DECK.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('')}</div>${i<DECK.length-1?'<button id="sn2">다음 ›</button>':'<a class="btn acc" href="#/jobs" id="sj">채용공고 보기</a>'}</div>`);
    $('#sp').onclick=()=>{i--;draw()};const n=$('#sn2');if(n)n.onclick=()=>{i++;draw()};const sj=$('#sj');if(sj)sj.onclick=closeM};draw()};
}
function pFaq(){
  app.innerHTML=`<div class="w"><h1 class="h1">자주 묻는 질문</h1><p class="lead">궁금한 내용은 먼저 '자주 묻는 질문'에서 확인해 보세요.<br>원하는 답이 없다면 '1:1 문의하기'로 남겨 주시면 담당자가 빠르게 답변드릴게요.</p>
   <div class="ph"><img src="img/faq.jpg" alt="노트북으로 일하는 손"></div>
   <div class="fq">${FAQ.map(q=>`<details><summary>${esc(q[0])}</summary><div class="a">${esc(q[1])}</div></details>`).join('')}</div>
   <div class="ask"><div><b style="font-size:20px">원하는 답을 찾지 못하셨나요?</b><div style="color:var(--muted)">평일 09:00~18:00에 순서대로 답변드려요.</div></div><button class="btn" id="aq">1:1 문의하기</button></div></div>`;
  $('#aq').onclick=()=>{modal(`<h3 style="margin:0 0 6px">1:1 문의하기</h3><p style="color:var(--muted);margin:0 0 10px">답변은 입력한 이메일로 보내 드려요.</p><form id="qf" novalidate><div class="fg" style="margin-top:10px"><label for="qn">이름</label><input class="in" id="qn" autocomplete="name"></div><div class="fg"><label for="qe">이메일</label><input class="in" id="qe" type="email" autocomplete="email"></div><div class="fg"><label for="qt">문의 유형</label><select class="in" id="qt"><option>채용 절차</option><option>지원서 수정·취소</option><option>면접 일정</option><option>기타</option></select></div><div class="fg"><label for="qb">내용</label><textarea class="in" id="qb" style="min-height:120px" maxlength="2000"></textarea></div><p class="err" id="qer" hidden></p><button class="btn acc" style="width:100%;justify-content:center;margin-top:16px">문의 남기기</button></form>`);
    $('#qf').onsubmit=e=>{e.preventDefault();const n=$('#qn').value.trim(),em=$('#qe').value.trim(),b=$('#qb').value.trim();
      if(n.length<2||!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em)||b.length<10){$('#qer').textContent='이름, 이메일, 10자 이상의 내용을 입력해 주세요.';$('#qer').hidden=false;return}
      const all=LS.get('bd_recruit_q',[]);all.unshift({n,em,t:$('#qt').value,b,at:Date.now()});LS.set('bd_recruit_q',all);closeM();toast('문의를 남겼어요. 영업일 기준 1~2일 안에 답변드릴게요')}};
}
function pStory(i){
  const s=STORIES[+i];if(!s){location.hash='#/';return}
  app.innerHTML=`<article class="art"><a class="back" href="#/">← 목록으로</a><div style="margin-top:20px"><span class="tag">${s.tag}</span></div><h1>${esc(s.title)}</h1><div class="by">${esc(s.by)}</div><img src="img/${s.img}.jpg" alt="">
   ${s.body.map(([k,t])=>k==='h'?`<h3>${esc(t)}</h3>`:k==='q'?`<blockquote>"${esc(t)}"</blockquote>`:`<p>${esc(t)}</p>`).join('')}</article>
   <div class="w"><section class="sec"><h2 class="h2">다른 이야기</h2><div class="stg">${STORIES.map((x,k)=>k===+i?'':storyCard(x,k)).filter(Boolean).slice(0,3).join('')}</div></section>${joinSec()}</div>`;
}
function pPrivacy(){
  app.innerHTML=`<article class="art"><h1>채용 개인정보 처리방침</h1><p>(주)바로담(이하 "회사")은 입사 지원자의 개인정보를 소중히 다루며, 「개인정보 보호법」에 따라 다음과 같이 처리합니다.</p>
   <h3>1. 수집 항목</h3><p>필수: 이름, 이메일, 연락처, 지원경로, 이력서, 유관 경력 기간, 보훈·장애 여부(민감정보)<br>선택: 포트폴리오, 개인/업무 URL, 지원동기</p>
   <h3>2. 이용 목적</h3><p>지원자 본인 확인, 채용 전형 진행과 결과 안내, 관련 법에 따른 우대 적용</p>
   <h3>3. 보유 및 이용 기간</h3><p>지원서 제출일부터 3년 동안 보관한 뒤 파기합니다. 지원자가 삭제를 요청하면 5일 이내에 삭제합니다.</p>
   <h3>4. 제3자 제공</h3><p>회사는 지원자의 개인정보를 외부에 제공하지 않습니다.</p>
   <h3>5. 지원자의 권리</h3><p>지원자는 언제든 개인정보 열람, 정정, 삭제, 처리 정지를 요청할 수 있습니다. [지원 현황 조회]에서 지원을 취소하거나 recruit@barodam.kro.kr 로 요청해 주세요.</p>
   <h3>6. 개인정보 보호책임자</h3><p>People팀 채용 담당 · recruit@barodam.kro.kr</p><p style="color:var(--muted)">시행일: 2026년 11월 1일</p></article>`;
}

// ---------- router ----------
const R={'':pHome,jobs:pJobs,job:pJob,apply:pApply,done:pDone,status:pStatus,culture:pCulture,faq:pFaq,story:pStory,privacy:pPrivacy};
function route(){
  closeM();document.body.classList.remove('dark-hd');$('#nav').classList.remove('open');$('#mnav').setAttribute('aria-expanded','false');
  const [n,...a]=location.hash.replace(/^#\/?/,'').split('/').map(decodeURIComponent);
  (R[n]||pHome)(...a);
  document.querySelectorAll('[data-n]').forEach(x=>x.toggleAttribute('aria-current',x.dataset.n===n||(n==='job'||n==='apply')&&x.dataset.n==='jobs'));
  const titles={jobs:'채용공고',job:'채용공고',apply:'지원서 작성',culture:'바로담 DNA',faq:'자주 묻는 질문',story:'구성원 이야기',status:'지원 현황 조회',privacy:'채용 개인정보 처리방침'};
  document.title=(titles[n]?titles[n]+' - ':'')+'바로담 인재영입 - 바로담 채용 사이트';
  scrollTo(0,0);
}
addEventListener('hashchange',route);
addEventListener('scroll',()=>$('#hd').classList.toggle('scrolled',scrollY>40),{passive:true});
$('#mnav').onclick=()=>{const o=$('#nav').classList.toggle('open');$('#mnav').setAttribute('aria-expanded',String(o))};
$('#fam').onchange=e=>{if(e.target.value)window.open(e.target.value,'_blank','noopener');e.target.value=''};
route();
})();
</script>
</body>
</html>
